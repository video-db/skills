name: plugin tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live suite against the real MCP server (needs an authorized claude on the runner)"
        default: false
        type: boolean

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @anthropic-ai/claude-code
      - run: python3 tests/static_checks.py
      - run: claude plugin validate .

  evals:
    needs: static
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @anthropic-ai/claude-code
      - name: Skipped, no API key configured
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: |
          echo "::warning title=Eval suites skipped::ANTHROPIC_API_KEY is not set as a repository secret, so this job ran no evals. Only the static checks passed."
          echo "## Eval suites skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "ANTHROPIC_API_KEY is not set as a repository secret. Add it under Settings → Secrets to run the chat and offline suites in CI. Until then, a green check here means static checks only." >> "$GITHUB_STEP_SUMMARY"
      - name: Chat suite (mocked connector)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: RUNS=1 THRESHOLD=0.8 MAX_COST=10 tests/run.sh chat
      - name: Not-connected chat case
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: claude plugin eval . --eval-dir evals-no-connector --tag chat --trust-plugin --no-publish --runs 1 --threshold 0.8 --max-cost-usd 3 --ablation none --json evals-no-connector/results/ci.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.ANTHROPIC_API_KEY != '' }}
        with:
          name: eval-results
          path: |
            evals/results/
            evals-no-connector/results/
